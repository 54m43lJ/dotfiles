# Desktop variant: no session locking, no auto-suspend.
general {
  after_sleep_cmd = ~/.config/hypr/scripts/after_sleep
}

listener {
  timeout = 60
  on-timeout = ~/.config/hypr/scripts/dim
  on-resume = ~/.config/hypr/scripts/undim
}

listener {
  timeout = 300
  on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
  on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'
}
