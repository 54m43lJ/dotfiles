# pc_beijing: the dock's iGPU output (DP-5) is unused; the monitor hangs off
# the dGPU (DP-3). X names the iGPU outputs <name>-1-<N>, hence "DP-1-5".
# Keeps the sddm greeter (X11) off the dead dock path.
Section "Monitor"
    Identifier "DP-1-5"
    Option "Ignore" "true"
EndSection

# DP-3: cold-boot EDID misses make the output report disconnected and X
# falls back to 1024x768 (black greeter). Manually configure the screen
# per the wiki (SDDM#Screen_resolution_is_too_low): modeline, preferred
# mode, forced enable and physical size, so no EDID is needed.
# Modeline from `cvt -r 3840 2160 60` (CVT-RB, matches the panel's native
# 594MHz-class timing), physical size from hyprctl (597mm x 336mm).
Section "Monitor"
    Identifier "DP-3"
    Modeline "3840x2160R" 533.00 3840 3888 3920 4000 2160 2163 2168 2222 +hsync -vsync
    Option "PreferredMode" "3840x2160R"
    Option "Enable" "true"
    DisplaySize 597 336
EndSection

Section "Screen"
    Identifier "Default Screen"
    Monitor "DP-3"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "3840x2160R"
    EndSubSection
EndSection
