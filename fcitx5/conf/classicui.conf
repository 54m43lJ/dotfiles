# Classic user interface. Keys not listed here fall back to fcitx5 defaults.

# Font
Font="Sans Serif 14"
# Theme (themes/ in this repo: palette-light, palette-dark)
Theme=palette-light
# Follow the XDG color-scheme portal; DarkTheme wins when the system is dark.
# Set UseDarkTheme=False to pin Theme= regardless of system mode.
UseDarkTheme=True
DarkTheme=palette-dark
