# Palette Dark — dotfiles palette, dark mode (palette/README.md)
# Cream-purple dark system. Large rounded corners (17px panel, 10px
# selection pill). Source of truth: palette/README.md, do not retune colors
# here without updating that file first.

[Metadata]
Name=Palette Dark
Name[zh_CN]=调色盘 · 暗色
Version=1
Author=dotfiles
Description=Fcitx5 theme built from the dotfiles dark palette: cream/purple/gold on deep charcoal, large rounded corners.
Description[zh_CN]=基于 dotfiles 暗色调色盘的 Fcitx5 主题：奶油紫金、深炭底、大圆角。
ScaleWithDPI=True

[InputPanel]
