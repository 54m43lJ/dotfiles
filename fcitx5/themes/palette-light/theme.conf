# Palette Light — dotfiles palette, light mode (palette/README.md)
# Alabaster bg/fg + purple/gold accents. Large rounded corners (17px panel,
# 10px selection pill). Source of truth: palette/README.md, do not retune
# colors here without updating that file first.

[Metadata]
Name=Palette Light
Name[zh_CN]=调色盘 · 亮色
Version=1
Author=dotfiles
Description=Fcitx5 theme built from the dotfiles light palette: Alabaster base, purple/gold accents, large rounded corners.
Description[zh_CN]=基于 dotfiles 亮色调色盘的 Fcitx5 主题：Alabaster 底、紫金点缀、大圆角。
ScaleWithDPI=True

[InputPanel]
EnableBlur=False
# fg on surface
NormalColor=#000000
# preedit highlight: fg on the highlight token
HighlightColor=#000000
HighlightBackgroundColor=#E9DBF2
# selected candidate: fg on purple-light (9.4:1)
HighlightCandidateColor=#000000
# muted candidate index / comment
CandidateLabelColor=#55585C
HighlightCandidateLabelColor=#000000CC
CandidateCommentColor=#55585C
HighlightCandidateCommentColor=#00000099
PageButtonAlignment=Last Candidate

[InputPanel/TextMargin]
Left=10
Right=10
Top=6
Bottom=6

[InputPanel/ContentMargin]
