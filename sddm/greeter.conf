[General]
DisplayServer=wayland

[Wayland]
# cage (wlroots) instead of kwin_wayland.
#
# KWin 6.7+ ranks amdgpu's advertised RGBA8888 (RA24) equal to
# ARGB8888/ABGR8888. The winner is decided by QHash iteration order, which is
# randomized per process. amdgpu lists RA24 on every primary plane but DCN4
# rejects it in fill_dc_plane_info_and_addr() (drm/amd#5339, KDE bug 524476),
# so one unlucky draw fails every atomic commit and the greeter stays black
# until the compositor is restarted. Hyprland and wlroots compositors do not
# rank RA24 first; cage is already the kiosk compositor used by the archived
# greetd module.
#
# -s keeps VT switching (Ctrl+Alt+F*) available, so a broken greeter can
# still be recovered from a text console.
CompositorCommand=cage -s
