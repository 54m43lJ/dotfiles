# hyprlock — styled after the Sugar Dark SDDM theme
# (white typography, pink accent, translucent form panel on the right)
#
# Note: hyprlock does not scale font_size with the monitor scale. The sizes
# below are tuned for a 4K output at scale 2; halve them on a 1x output.

general {
    hide_cursor = false
    fractional_scaling = 2
}

background {
    monitor =
    path = ~/.config/hypr/graduation_dark.jpg
    color = rgb(0, 0, 0)
}

# Translucent form panel on the right, like the SDDM login form
shape {
    monitor =
    size = 40%, 100%
    color = rgba(68, 68, 68, 0.6)
    rounding = 0
    halign = right
    valign = center
    position = 0, 0
    zindex = 0
}

# Clock block
label {
    monitor =
    text = $TIME
    font_family = Noto Sans
    font_size = 76
    color = rgb(255, 255, 255)
    halign = center
    valign = center
    position = 30%, 32%
    zindex = 1
}

label {
    monitor =
    text = cmd[update:60000] date "+%A, %-d of %B"
    font_family = Noto Sans
    font_size = 26
    color = rgb(255, 255, 255)
    halign = center
    valign = center
    position = 30%, 28%
    zindex = 1
}

# Decorative user field, matching the SDDM username pill
shape {
    monitor =
    size = 20%, 4%
    color = rgba(0, 0, 0, 0)
    border_size = 1
    border_color = rgb(255, 255, 255)
    rounding = -1
    halign = right
    valign = center
    position = -10%, 4%
    zindex = 1
}

label {
    monitor =
    text = <span font_family='Noto Sans Nerd Font'></span>
    font_family = Noto Sans
    font_size = 16
    color = rgb(255, 255, 255)
    halign = left
    valign = center
    position = 71%, 3%
    zindex = 2
}

label {
    monitor =
    text = $USER
    font_family = Noto Sans
    font_size = 26
    color = rgb(255, 255, 255)
    halign = center
    valign = center
    position = 30%, 4%
    zindex = 2
}

# Password field — pink accent like SDDM's focused input
input-field {
    monitor =
    size = 20%, 4%
    rounding = -1
    outline_thickness = 2
    inner_color = rgba(0, 0, 0, 0)
    outer_color = rgb(ca33ac)
    font_color = rgb(255, 255, 255)
    font_family = Noto Sans
    check_color = rgb(ca33ac)
    fail_color = rgb(ca33ac)
    capslock_color = rgb(255, 255, 255)
    fail_text = <span size='20pt'><i>$FAIL</i></span>
    placeholder_text = <span size='26pt'><i>Password</i></span>
    fade_on_empty = false
    dots_size = 0.25
    halign = right
    valign = center
    position = -10%, -2%
    zindex = 2
}

# Submit arrow inside the password field (sends Enter to hyprlock)
label {
    monitor =
    text = →
    font_family = Noto Sans
    font_size = 26
    color = rgb(255, 255, 255)
    halign = right
    valign = center
    position = -10.5%, -2%
    zindex = 3
    onclick = hyprctl dispatch 'hl.dsp.send_shortcut({ mods = "", key = "Return" })'
}

# Session label at the bottom of the panel, like SDDM
label {
    monitor =
    text = Session: Hyprland
    font_family = Noto Sans
    font_size = 23
    color = rgb(255, 255, 255)
    halign = left
    valign = center
    position = 70%, -42%
    zindex = 1
}
