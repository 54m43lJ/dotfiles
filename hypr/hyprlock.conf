# hyprlock — styled after the Sugar Dark SDDM theme
# (white typography, pink accent, translucent form panel on the right)
#
# Numeric layout contract: LOGIN_UI.md
# Percentages are relative to the output; font sizes are surface pixels and
# do not follow the monitor scale (the values below target 4K at scale 2).
# Position y is an offset from centre; positive moves up.

# ---- geometry ----
$panelW       = 40%
$centerX      = 30%
$fieldX       = -10%
$fieldW       = 20%
$fieldH       = 3.7%
$timeY        = 32%
$dateY        = 28%
$userY        = 3.6%
$passwordY    = -1.8%
$iconX        = 71.5%
$iconY        = 3.6%
$arrowX       = -10.5%
$arrowY       = -1.8%
$sessionX     = 71.35%
$sessionY     = -46.5%

# ---- typography ----
$font         = Noto Sans
$fsClock      = 76
$fsText       = 26
$fsSmall      = 23
$fsIcon       = 28
$fsArrow      = 39

general {
    hide_cursor = false
    fractional_scaling = 2
}

background {
    monitor =
    path = ~/.config/hypr/graduation_dark.jpg
    color = rgb(0, 0, 0)
}

# Translucent form panel on the right, like the SDDM login form
shape {
    monitor =
    size = $panelW, 100%
    color = rgba(68, 68, 68, 0.6)
    rounding = 0
    halign = right
    valign = center
    position = 0, 0
    zindex = 0
}

# Clock block
label {
    monitor =
    text = $TIME
    font_family = $font
    font_size = $fsClock
    color = rgb(255, 255, 255)
    halign = center
    valign = center
    position = $centerX, $timeY
    zindex = 1
}

label {
    monitor =
    text = cmd[update:60000] date "+%A, %-d of %B"
    font_family = $font
    font_size = $fsText
    color = rgb(255, 255, 255)
    halign = center
    valign = center
    position = $centerX, $dateY
    zindex = 1
}

# Decorative user field, matching the SDDM username pill
shape {
    monitor =
    size = $fieldW, $fieldH
    color = rgba(0, 0, 0, 0)
    border_size = 2
    border_color = rgb(255, 255, 255)
    rounding = -1
    halign = right
    valign = center
    position = $fieldX, $userY
    zindex = 1
}

label {
    monitor =
    text = <span font_family='Noto Sans Nerd Font'></span>
    font_family = $font
    font_size = $fsIcon
    color = rgb(255, 255, 255)
    halign = left
    valign = center
    position = $iconX, $iconY
    zindex = 2
}

label {
    monitor =
    text = $USER
    font_family = $font
    font_size = $fsText
    color = rgb(255, 255, 255)
    halign = center
    valign = center
    position = $centerX, $userY
    zindex = 2
}

# Password field — pink accent like SDDM's focused input
input-field {
    monitor =
    size = $fieldW, $fieldH
    rounding = -1
    outline_thickness = 4
    inner_color = rgba(0, 0, 0, 0)
    outer_color = rgb(ca33ac)
    font_color = rgb(255, 255, 255)
    font_family = $font
    check_color = rgb(ca33ac)
    fail_color = rgb(ca33ac)
    capslock_color = rgb(255, 255, 255)
    fail_text = <span size='20pt'><i>$FAIL</i></span>
    placeholder_text = <span size='26pt'><i>Password</i></span>
    fade_on_empty = false
    dots_size = 0.25
    halign = right
    valign = center
    position = $fieldX, $passwordY
    zindex = 2
}

# Submit arrow inside the password field (sends Enter to hyprlock)
label {
    monitor =
    text = →
    font_family = $font
    font_size = $fsArrow
    color = rgb(255, 255, 255)
    halign = right
    valign = center
    position = $arrowX, $arrowY
    zindex = 3
    onclick = hyprctl dispatch 'hl.dsp.send_shortcut({ mods = "", key = "Return" })'
}

# Session label at the bottom of the panel, like SDDM
label {
    monitor =
    text = Session: Hyprland
    font_family = $font
    font_size = $fsSmall
    color = rgb(255, 255, 255)
    halign = left
    valign = center
    position = $sessionX, $sessionY
    zindex = 1
}
