# Workspace rules
windowrulev2 = workspace empty, class:^(codium)$
windowrulev2 = workspace empty, class:^([bB]rave-browser)$
windowrulev2 = workspace empty, class:^(thunderbird)$, title:.*(Mozilla Thunderbird)$
windowrulev2 = workspace 10, title:^(Spotify|Spotify Premium)$
windowrulev2 = workspace 10, class:^(qqmusic)$
windowrulev2 = workspace 9, class:^(obsidian)$
# Application rules
windowrulev2 = tile, class:^(wps|wpp|et|pdf|prometheus|wpsoffice)$
windowrulev2 = fullscreen, class:^(MPlayer)$
# Popup rules
windowrulev2 = float, class:^(xdg-desktop-portal-gtk)$
windowrulev2 = float, class:^(nemo)$
windowrulev2 = float, class:^(galculator|org\.gnome\.Calculator)$
windowrulev2 = float, class:^(clash_win|Clash for Windows)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(org.openrgb.OpenRGB)$
windowrulev2 = float, class:polkit
windowrulev2 = float, class:wechat
windowrulev2 = float, class:^(org\.keepassxc\.KeePassXC)$
# Special place in hell
windowrulev2 = opaque, xwayland:1
windowrulev2 = noblur, xwayland:1
windowrulev2 = nodim, xwayland:1
windowrulev2 = float, class:^(org.fcitx.fcitx5-config-qt)$
windowrulev2 = fullscreen, class:^(qt5ct)$
windowrulev2 = fullscreen, class:^(pavucontrol)$
