<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- ================================================================
       Rendering defaults
       ================================================================ -->
  <match target="font">
    <edit name="antialias"  mode="assign"><bool>true</bool></edit>
    <edit name="hinting"    mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle"  mode="assign"><const>hintslight</const></edit>
    <edit name="rgba"       mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter"  mode="assign"><const>lcddefault</const></edit>
  </match>

  <!-- Disable embedded bitmaps globally (re-enable for emoji below) -->
  <match target="font">
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="font">
    <test name="family" qual="any">
      <string>Noto Color Emoji</string>
    </test>
    <edit name="embeddedbitmap" mode="assign"><bool>true</bool></edit>
  </match>

  <!-- ================================================================
       Sans-serif: Roboto (Latin, primary) → CJK → Emoji
       ================================================================ -->
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend"><string>Noto Color Emoji</string></edit>
    <edit name="family" mode="prepend"><string>Noto Sans CJK SC</string></edit>
    <edit name="family" mode="prepend" binding="strong"><string>Roboto</string></edit>
  </match>

  <!-- ================================================================
       Serif: Noto Serif CJK SC (CJK + Latin, primary) → Emoji
       ================================================================ -->
  <match target="pattern">
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="prepend"><string>Noto Color Emoji</string></edit>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>

  <!-- ================================================================
       Monospace: Nerd Font (Latin + icons, primary) → CJK → Emoji
       ================================================================ -->
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend"><string>Noto Color Emoji</string></edit>
    <edit name="family" mode="prepend"><string>Noto Sans CJK SC</string></edit>
    <edit name="family" mode="prepend" binding="strong"><string>NotoSansM Nerd Font Mono</string></edit>
  </match>

  <!-- ================================================================
       Nerd Font catch-all: any font with "Nerd Font" in its name
       automatically gets CJK + Emoji fallback
       ================================================================ -->
  <match target="pattern">
    <test name="family" qual="any" compare="contains">
      <string>Nerd Font</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Sans CJK SC</string>
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <!-- ================================================================
       Legacy font substitutions: map Windows + old Linux fonts → Noto CJK
       ================================================================ -->
  <!-- WenQuanYi family -->
  <match target="pattern">
    <test qual="any" name="family"><string>WenQuanYi Zen Hei</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>WenQuanYi Zen Hei Lite</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>WenQuanYi Zen Hei Mono</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK SC</string></edit>
  </match>
  <!-- Microsoft Windows fonts -->
  <match target="pattern">
    <test qual="any" name="family"><string>Microsoft YaHei</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Microsoft JhengHei</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>SimHei</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>SimSun</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>SimSun-18030</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>NSimSun</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>MingLiU</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>PMingLiU</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>FangSong</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>KaiTi</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK SC</string></edit>
  </match>

</fontconfig>
