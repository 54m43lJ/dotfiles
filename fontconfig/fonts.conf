<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- ================================================================
       Rendering defaults
       ================================================================ -->
  <match target="font">
    <edit name="antialias"  mode="assign"><bool>true</bool></edit>
    <edit name="hinting"    mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle"  mode="assign"><const>hintslight</const></edit>
    <edit name="rgba"       mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter"  mode="assign"><const>lcddefault</const></edit>
  </match>

  <!-- Disable embedded bitmaps globally (re-enable for emoji below) -->
  <match target="font">
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="font">
    <test name="family" qual="any">
      <string>Noto Color Emoji</string>
    </test>
    <edit name="embeddedbitmap" mode="assign"><bool>true</bool></edit>
  </match>

  <!-- ================================================================
       Sans-serif: Roboto（拉丁）→ 中文 SC→TC→HK → 日文 JP → 韩文 KR → Emoji
       SC 必须排在 JP/KR 前面，否则 Noto CJK 始终优先显示日文字形
       ================================================================ -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Roboto</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans CJK TC</family>
      <family>Noto Sans CJK HK</family>
      <family>Noto Sans CJK JP</family>
      <family>Noto Sans CJK KR</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- ================================================================
       Serif: Noto Serif CJK SC→TC → JP → KR → Emoji
       ================================================================ -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif CJK SC</family>
      <family>Noto Serif CJK TC</family>
      <family>Noto Serif CJK JP</family>
      <family>Noto Serif CJK KR</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- ================================================================
       Monospace: Maple Mono Normal NF CN（拉丁 + Nerd 图标 + CJK 一体）
       → Noto CJK fallback（SC→TC→HK→JP→KR）→ Emoji
       ================================================================ -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Maple Mono Normal NF CN</family>
      <family>Noto Sans Mono CJK SC</family>
      <family>Noto Sans Mono CJK TC</family>
      <family>Noto Sans Mono CJK HK</family>
      <family>Noto Sans Mono CJK JP</family>
      <family>Noto Sans Mono CJK KR</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- ================================================================
        CJK fallback for Latin-only families（如 GTK 的 Adwaita Sans）
        这些字体本身没有汉字，逐字 fallback 由 fontconfig 默认排序决定；
        没有语言约束时它会在 Noto CJK 的 10 个 face 里先挑到 KR/JP，
        而 JP/KR face 的 与 是日文写法（末横拉满整个字宽），跟浏览器的
        SC 字形对不上。这里用 weak prepend 把 SC 放到所有 pattern 的
        family 表最前面：请求的字体（以及上面 serif/monospace 的 prefer
        列表）仍是 strong，拉丁和有自带 CJK 的字体不受影响，只有缺字的
        才落到 Noto Sans CJK SC。
       ================================================================ -->
  <match target="pattern">
    <edit name="family" mode="prepend" binding="weak">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>

  <!-- ================================================================
        Nerd Font catch-all: 任何带 "Nerd Font" 名称的字体自动追加
        Maple Mono Normal NF CN（CJK + 图标），Noto CJK 兜底
        ================================================================ -->
  <match target="pattern">
    <test name="family" qual="any" compare="contains">
      <string>Nerd Font</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Maple Mono Normal NF CN</string>
      <string>Noto Sans CJK SC</string>
      <string>Noto Sans CJK TC</string>
      <string>Noto Sans CJK HK</string>
      <string>Noto Sans CJK JP</string>
      <string>Noto Sans CJK KR</string>
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <!-- ================================================================
        Legacy font substitutions: map Windows + old Linux fonts → Noto CJK
        ================================================================ -->
  <!-- WenQuanYi family -->
  <match target="pattern">
    <test qual="any" name="family"><string>WenQuanYi Zen Hei</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>WenQuanYi Zen Hei Lite</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>WenQuanYi Zen Hei Mono</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK SC</string></edit>
  </match>
  <!-- Microsoft Windows fonts -->
  <match target="pattern">
    <test qual="any" name="family"><string>Microsoft YaHei</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Microsoft JhengHei</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>SimHei</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>SimSun</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>SimSun-18030</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>NSimSun</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>MingLiU</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>PMingLiU</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>FangSong</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>KaiTi</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK SC</string></edit>
  </match>

</fontconfig>
